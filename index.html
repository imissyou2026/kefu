<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="maximum-scale=1.0,minimum-scale=1.0,user-scalable=0,width=device-width,initial-scale=1.0" />
<title>网页客服</title>
</head>
<body>
<script src="https://chatbot.weixin.qq.com/mmspraiweb_node/dist/static/script/H5_SDK_ACCESS.js"> </script>
<script>

const params = new URLSearchParams(window.location.search);
const token = params.get("token") ?? "";
const openid = params.get("openid") ?? "";
const user = "当前用户："+ openid;

WxChat.init({
	appId: token,
	openId: openid,
	robotName: user,
	mode: "fullscreen",
});

</script>
</body>
</html>
